name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements.lock
          npm ci --prefix frontend
          ./scripts/check.sh
      - run: |
          docker build -t opora-api:${{ github.sha }} backend
          docker build -t opora-web:${{ github.sha }} -f deploy/Dockerfile.web .
          docker save opora-api:${{ github.sha }} opora-web:${{ github.sha }} | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar.gz
          retention-days: 1
          compression-level: 0
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: images
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy tested revision
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          mkdir bundle
          git archive HEAD | tar -x -C bundle
          mv images.tar.gz bundle/
          tar -czf bundle.tar.gz -C bundle .
          mkdir chunks
          split -b 1M -d -a 4 bundle.tar.gz chunks/part-
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /home/alexandret/opora/incoming/$DEPLOY_SHA"
          find chunks -type f -print0 | xargs -0 -P 4 -I '{}' bash -c 'scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes "$1" "$DEPLOY_USER@$DEPLOY_HOST:/home/alexandret/opora/incoming/$DEPLOY_SHA/"' _ '{}'
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "set -o pipefail; cat /home/alexandret/opora/incoming/$DEPLOY_SHA/part-* | bash /home/alexandret/opora/deploy.sh $DEPLOY_SHA && rm -r /home/alexandret/opora/incoming/$DEPLOY_SHA"
