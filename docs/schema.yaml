components:
  schemas:
    Area:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
        color:
          type: string
          maxLength: 20
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - id
      - name
    Board:
      type: object
      properties:
        today:
          type: string
          format: date
        week:
          type: string
          format: date
        areas:
          type: array
          items:
            $ref: '#/components/schemas/Area'
        captures:
          type: array
          items:
            $ref: '#/components/schemas/Capture'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        inbox_ids:
          type: array
          items:
            type: string
            format: uuid
        day_sections:
          type: array
          items:
            type: string
        day_entries:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
        week_rows:
          type: array
          items:
            $ref: '#/components/schemas/WeekRow'
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        google:
          $ref: '#/components/schemas/GoogleStatus'
      required:
      - areas
      - captures
      - day_entries
      - day_sections
      - events
      - google
      - inbox_ids
      - items
      - today
      - week
      - week_rows
    Capture:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        text:
          type: string
        source:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CaptureStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        results:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
      required:
      - created_at
      - id
      - results
      - source
      - status
      - text
    CaptureStatusEnum:
      enum:
      - open
      - processed
      - graveyard
      type: string
      description: |-
        * `open` - Не разобрана
        * `processed` - Разобрана
        * `graveyard` - Кладбище
    CheckCommand:
      type: object
      properties:
        done:
          type: boolean
      required:
      - done
    DaySections:
      type: object
      properties:
        sections:
          type: array
          items:
            type: string
            maxLength: 160
          maxItems: 40
      required:
      - sections
    Entry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        item:
          type: string
          format: uuid
        item_detail:
          allOf:
          - $ref: '#/components/schemas/Item'
          readOnly: true
        period:
          $ref: '#/components/schemas/EntryPeriodEnum'
        date:
          type: string
          format: date
        active:
          type: boolean
          default: true
        outcome:
          type: string
          maxLength: 16
        section:
          type: string
          maxLength: 160
        position:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        reason:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        checked:
          type: boolean
          readOnly: true
      required:
      - checked
      - created_at
      - date
      - id
      - item
      - item_detail
      - period
    EntryPeriodEnum:
      enum:
      - day
      - week
      type: string
      description: |-
        * `day` - День
        * `week` - Неделя
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 500
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        all_day:
          type: boolean
        done:
          type: boolean
        url:
          oneOf:
          - type: string
            format: uri
            maxLength: 2000
          - type: string
            maxLength: 0
        calendar_id:
          type: string
          maxLength: 500
      required:
      - calendar_id
      - end
