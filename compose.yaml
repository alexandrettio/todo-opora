services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: opora
      POSTGRES_USER: opora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opora -d opora"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://opora:${POSTGRES_PASSWORD}@db:5432/opora
      DEBUG: "0"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
    command:
      [
        "sh",
        "-c",
        "python manage.py migrate --noinput && python manage.py bootstrap && python manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 90 --access-logfile -",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/session/',headers={'Host':'localhost'}), timeout=5)",
        ]
      interval: 20s
      timeout: 6s
      retries: 10
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://opora:${POSTGRES_PASSWORD}@db:5432/opora
      DEBUG: "0"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "while true; do python manage.py sync_calendars; sleep 3600; done",
      ]
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - staticfiles:/staticfiles:ro
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  staticfiles:
